# Local-only broker for the Home Privacy Agent. Run:
#   "C:\Program Files\Mosquitto\mosquitto.exe" -c code\mosquitto.conf -v
# Listens on the LAN so the ESP32 nodes can reach it; never bridged to anything.
listener 1883 0.0.0.0
allow_anonymous true
# Defense in depth (optional): create a password file with
#   mosquitto_passwd -c code\mosq_passwd homeagent
# then set:  allow_anonymous false   and   password_file code\mosq_passwd
# (add mqtt.connect(NODE_ID, "homeagent", "<pw>") in the firmware and username_pw_set() in Python).
# There is deliberately NO 'connection' (bridge) block: nothing is forwarded off this machine.
